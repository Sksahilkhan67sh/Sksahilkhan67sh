name: Generate Neon Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate neon and light-mode snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: Sksahilkhan67sh
          outputs: |
            dist/github-snake-neon.svg?color_snake=%2300F5B8&color_dots=%230D1117,%230B3D32,%2300A878,%2300D9A6,%237CFFE0
            dist/github-snake-light.svg?color_snake=%2300785A&color_dots=%23EBEDF0,%239BE9A8,%2340C463,%2330A14E,%232161E5

      - name: Publish generated animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
